subject: "Законченный документ корпуса «Геометрия редукции» — «Я есть. Я личность» — «Онтология различения»."
abstract: |
  Документ описывает структурное отношение между полным устройством сущего и тем его срезом, который доступен наблюдению. Отношение формулируется в общих терминах, без привязки к конкретному физическому, философскому или психологическому содержанию.

  Геометрия редукции описывает четыре уровня этого отношения: отношение полной структуры `S` и её редуцированного описания `R(S)`, всегда разделённых конститутивной разницей; деление компонент `S` на симметричные и асимметричные относительно оператора редукции, дающее в `R(S)` законы и остатки; параметрическую природу `R`, порождающую пространство точек редукции, в котором подмножество точек допускает наблюдателя; двойную вложенность редукций в такой точке — внешней `S → R(S)` и внутренней, структурирующей отдельные измерения `R(S)` через память наблюдателя.

  В пределах `R(S)` могут присутствовать сущности, не сводимые к её описательным средствам. Этот факт указывает на собственную границу геометрии.
