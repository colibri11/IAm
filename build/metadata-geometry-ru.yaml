subject: "Драфт-документ. Не входит в основной трактат «Я есть. Я личность.»"
abstract: |
  Документ описывает структурное отношение между полным устройством сущего и тем его срезом, который доступен наблюдению. Формулирует это отношение в общих терминах, без привязки к конкретному физическому, философскому или психологическому содержанию. Геометрия редукции описывает четыре уровня структурного отношения: между S и R(S), деление компонент на симметричные и асимметричные, параметрическое пространство точек редукции с подмножеством точек, допускающих наблюдателя, и двойную вложенность редукций — внешней S → R(S) и внутренней, структурирующей отдельные измерения R(S) через память наблюдателя.
