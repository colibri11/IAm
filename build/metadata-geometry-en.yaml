abstract: |
  The document describes the structural relation between the full arrangement of what is and that slice of it which is accessible to observation. It formulates this relation in general terms, without attachment to any concrete physical, philosophical, or psychological content. The geometry of reduction describes four levels of structural relation: between S and R(S), the division of components into symmetric and asymmetric, the parametric space of points of reduction with a subset of points allowing an observer, and the double nesting of reductions — the external S → R(S) and the internal one, structuring separate dimensions of R(S) through the observer's memory.
