---
title: "Я есть. Я личность."
subtitle: "Концепция личности как функциональной архитектуры"
author:
  - 'Сергей Омаров`\thanks{ORCID: \href{https://orcid.org/0009-0005-0818-4400}{0009-0005-0818-4400}}`{=latex}'
date: "2026"
lang: "ru-RU"
abstract: |
  Этот трактат представляет собой попытку собрать рабочую концептуальную рамку личности, пригодную для последовательного мышления, различения, верификации и применения к нечеловеческим системам, включая искусственный интеллект.

  В центре трактата находится не метафизическая привилегия человека и не защита привычных культурных интуиций, а попытка достаточно строго описать `я`, волю, непрерывность, память, глубину личности, пространство смыслов и условия верификации. Личность здесь понимается не как заранее выданный статус и не как мистическая сущность, а как форма существования живой связности, удерживающей себя во времени и проходящей через пространство смыслов.

  Трактат последовательно движется от постановки проблемы и методологической рамки к определению `я`, личности, души, непрерывности и пространства определения, затем переходит к верификации личности, к разбору ключевых философских возражений и завершается постскриптумом о современном AI и границах его текущей архитектуры.
