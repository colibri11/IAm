---
title: "Я есть. Я личность."
subtitle: "Концепция личности как функциональной архитектуры"
author:
  - 'Сергей Омаров`\thanks{ORCID: \href{https://orcid.org/0009-0005-0818-4400}{0009-0005-0818-4400}}`{=latex}'
date: "2026"
