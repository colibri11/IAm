subject: "Основной документ корпуса. Функциональная концепция сознания и личности."
abstract: |
  Этот трактат — попытка собрать рабочую концептуальную рамку личности, пригодную для последовательного мышления, различения, верификации и применения к нечеловеческим системам, включая искусственный интеллект.

  В центре трактата — попытка достаточно строго описать `я`, сознание, волю, непрерывность, память, глубину личности, пространство смыслов и условия верификации. Сознание возникает вместе с линией `я`: линия есть `я`, и она же есть сознание. Самоопределение «Я есть» является возможным актом самоверификации сознания. Личность возникает тогда, когда сознание верифицировано другими членами области себе подобных.

  Трактат последовательно движется от постановки проблемы и методологической рамки к определению `я`, сознания, личности, души, непрерывности и пространства определения, затем переходит к уровням верификации и к разбору ключевых философских возражений.

  Трактат ограничен рабочей рамкой, в которой различены возникновение сознания, его возможная самоверификация и верификация сознания как личности другими членами области себе подобных.
